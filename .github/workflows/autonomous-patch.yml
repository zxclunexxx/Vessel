name: Apply Vessel autonomous patch

on:
  push:
    branches:
      - 'autonomous/**'
    paths:
      - 'scripts/*.py'
      - '.github/workflows/autonomous-patch.yml'

permissions:
  contents: write

concurrency:
  group: autonomous-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse protected/default branch mutation
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != autonomous/* ]]; then
            echo "Autonomous patching is restricted to autonomous/* branches" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch pipeline
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_patch_pipeline.py 2>&1 | tee autonomous-patch.log
      - name: Preserve patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-patch-diagnostics-${{ github.run_id }}
          path: autonomous-patch.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify generated behavior
        run: python scripts/run_fast_smoke_checks.py
      - name: Preserve generated Fast Gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-fast-gate-diagnostics-${{ github.run_id }}
          path: fast-gate-smoke.log
          if-no-files-found: warn
          retention-days: 7
      - name: Check JavaScript syntax
        run: node --check src/main.js
      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Audit full dependency graph
        run: npm audit --audit-level=high
      - name: Verify production build
        run: npm run build
      - name: Commit verified generated changes to sprint branch
        run: |
          if git diff --quiet -- src/main.js src/style.css server/schema.sql; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css server/schema.sql
          git commit -m "Apply verified Vessel autonomous patch"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=true
              break
            fi
            echo "Sprint branch advanced; rebasing attempt $attempt"
            git fetch --depth=20 origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            python scripts/run_fast_smoke_checks.py
            node --check src/main.js
            npm ci
            npm audit --audit-level=high
            npm run build
          done
          if [ "$pushed" != "true" ]; then
            echo "Unable to push verified autonomous patch after retries" >&2
            exit 1
          fi
