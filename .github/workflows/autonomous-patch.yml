name: Apply Vessel autonomous patch

on:
  push:
    paths:
      - 'scripts/autonomous_patch.py'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: python scripts/autonomous_patch.py
      - name: Check JavaScript syntax
        run: node --check src/main.js
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Verify production build
        run: npm run build
      - name: Commit verified changes
        run: |
          if git diff --quiet -- src/main.js src/style.css; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css
          git commit -m "Improve Vessel call lifecycle reliability"
          git push
