name: Apply Vessel autonomous patch

on:
  push:
    paths:
      - 'scripts/autonomous_patch.py'
      - 'scripts/reliability_patch.py'
      - 'scripts/session_patch.py'
      - 'scripts/lifecycle_patch.py'
      - 'scripts/attachment_context_patch.py'
      - 'scripts/call_security_patch.py'
      - 'scripts/profile_privacy_patch.py'
      - 'scripts/dm_thread_security_patch.py'
      - 'scripts/friend_request_policy_patch.py'
      - 'scripts/voice_reconnect_patch.py'
      - 'scripts/voice_switch_patch.py'
      - 'scripts/call_reconnect_patch.py'
      - 'scripts/message_context_patch.py'
      - 'scripts/server_context_patch.py'
      - 'scripts/dm_unfriend_history_patch.py'
      - 'scripts/notification_session_patch.py'

permissions:
  contents: write
  actions: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: |
          python scripts/autonomous_patch.py
          if [ -f scripts/reliability_patch.py ]; then python scripts/reliability_patch.py; fi
          if [ -f scripts/session_patch.py ]; then python scripts/session_patch.py; fi
          if [ -f scripts/lifecycle_patch.py ]; then python scripts/lifecycle_patch.py; fi
          if [ -f scripts/attachment_context_patch.py ]; then python scripts/attachment_context_patch.py; fi
          if [ -f scripts/call_security_patch.py ]; then python scripts/call_security_patch.py; fi
          if [ -f scripts/profile_privacy_patch.py ]; then python scripts/profile_privacy_patch.py; fi
          if [ -f scripts/dm_thread_security_patch.py ]; then python scripts/dm_thread_security_patch.py; fi
          if [ -f scripts/friend_request_policy_patch.py ]; then python scripts/friend_request_policy_patch.py; fi
          if [ -f scripts/voice_reconnect_patch.py ]; then python scripts/voice_reconnect_patch.py; fi
          if [ -f scripts/voice_switch_patch.py ]; then python scripts/voice_switch_patch.py; fi
          if [ -f scripts/call_reconnect_patch.py ]; then python scripts/call_reconnect_patch.py; fi
          if [ -f scripts/message_context_patch.py ]; then python scripts/message_context_patch.py; fi
          if [ -f scripts/server_context_patch.py ]; then python scripts/server_context_patch.py; fi
          if [ -f scripts/dm_unfriend_history_patch.py ]; then python scripts/dm_unfriend_history_patch.py; fi
          if [ -f scripts/notification_session_patch.py ]; then python scripts/notification_session_patch.py; fi
      - name: Check JavaScript syntax
        run: node --check src/main.js
      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Audit full dependency graph
        run: npm audit --audit-level=high
      - name: Verify production build
        run: npm run build
      - name: Commit verified changes
        id: commit
        run: |
          if git diff --quiet -- src/main.js src/style.css server/schema.sql; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css server/schema.sql
          git commit -m "Apply verified Vessel UX and reliability improvements"
          pushed=false
          for attempt in 1 2 3; do
            if git push; then
              pushed=true
              break
            fi
            echo "main advanced during autonomous patch; rebasing attempt $attempt"
            git fetch --depth=20 origin main
            git rebase origin/main
            node --check src/main.js
            npm ci
            npm audit --audit-level=high
            npm run build
          done
          if [ "$pushed" != "true" ]; then
            echo "Unable to push verified autonomous patch after retries" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch checks and distributable builds for generated commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run quality.yml --ref main
          gh workflow run web-pages.yml --ref main
          gh workflow run android-apk.yml --ref main
          gh workflow run windows-exe.yml --ref main
