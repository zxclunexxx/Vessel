name: Apply Vessel autonomous patch

on:
  push:
    paths:
      - 'scripts/autonomous_patch.py'

permissions:
  contents: write
  actions: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: python scripts/autonomous_patch.py
      - name: Check JavaScript syntax
        run: node --check src/main.js
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Verify production build
        run: npm run build
      - name: Commit verified changes
        id: commit
        run: |
          if git diff --quiet -- src/main.js src/style.css server/schema.sql; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css server/schema.sql
          git commit -m "Apply verified Vessel UX and reliability improvements"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch checks and distributable builds for generated commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run quality.yml --ref main
          gh workflow run web-pages.yml --ref main
          gh workflow run android-apk.yml --ref main
          gh workflow run windows-exe.yml --ref main
