name: Build Vessel Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      ELECTRON_BUILD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Build desktop web assets
        run: npm run desktop:build

      - name: Package Windows portable EXE
        run: npm run desktop:package

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vessel-windows-exe
          path: release/*.exe
          if-no-files-found: error
