name: Vessel Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticated runtime smoke check
        run: python scripts/runtime_smoke_check.py
      - name: DM history lifecycle smoke check
        run: python scripts/dm_history_smoke_check.py
      - name: Media context smoke check
        run: python scripts/media_context_smoke_check.py
      - name: JavaScript syntax check
        run: node --check src/main.js
      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Full dependency audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
