name: Vessel Fast Gate

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - 'autonomous/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fast smoke suite
        run: python scripts/run_fast_smoke_checks.py
      - name: Preserve Fast Gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-gate-diagnostics-${{ github.run_id }}
          path: fast-gate-smoke.log
          if-no-files-found: warn
          retention-days: 7
      - name: JavaScript syntax check
        run: node --check src/main.js
      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Full dependency audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
