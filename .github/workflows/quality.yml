name: Vessel Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticated runtime smoke check
        run: python scripts/runtime_smoke_check_current.py
      - name: Logout/session cleanup smoke check
        run: python scripts/logout_session_smoke_check.py
      - name: Realtime auth-session isolation smoke check
        run: python scripts/realtime_session_smoke_check.py
      - name: Private Realtime signaling security smoke check
        run: python scripts/realtime_security_smoke_check.py
      - name: DM history lifecycle smoke check
        run: python scripts/dm_history_smoke_check.py
      - name: DM identity update privilege smoke check
        run: python scripts/dm_identity_security_smoke_check.py
      - name: Friend request identity privilege smoke check
        run: python scripts/friend_request_identity_security_smoke_check.py
      - name: Friend request transition/notification smoke check
        run: python scripts/friend_request_transition_notification_smoke_check.py
      - name: Friend request retry lifecycle smoke check
        run: python scripts/friend_request_retry_client_smoke_check.py
      - name: Symmetric friendship delete smoke check
        run: python scripts/friendship_symmetry_smoke_check.py
      - name: Attachment upload context security smoke check
        run: python scripts/attachment_upload_context_smoke_check.py
      - name: Server owner membership invariant smoke check
        run: python scripts/server_owner_membership_smoke_check.py
      - name: Server ownership transfer smoke check
        run: python scripts/server_ownership_transfer_smoke_check.py
      - name: Voice peer reconnect smoke check
        run: python scripts/voice_peer_reconnect_smoke_check.py
      - name: Voice controls wiring smoke check
        run: python scripts/voice_controls_smoke_check.py
      - name: Incoming call timeout lifecycle smoke check
        run: python scripts/incoming_call_timeout_smoke_check.py
      - name: Direct-call ICE restart recovery smoke check
        run: python scripts/call_ice_restart_smoke_check.py
      - name: Media context smoke check
        run: python scripts/media_context_smoke_check.py
      - name: Notification read race smoke check
        run: python scripts/notification_read_smoke_check.py
      - name: Server/channel async context smoke check
        run: python scripts/server_context_smoke_check.py
      - name: Message auth context smoke check
        run: python scripts/message_auth_context_smoke_check.py
      - name: Stale channel send smoke check
        run: python scripts/channel_send_guard_smoke_check.py
      - name: JavaScript syntax check
        run: node --check src/main.js
      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Full dependency audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
