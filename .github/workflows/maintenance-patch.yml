name: Apply Vessel maintenance patch

on:
  push:
    paths:
      - 'scripts/maintenance_patch.py'
      - 'scripts/maintenance_trigger.txt'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: python scripts/maintenance_patch.py
      - name: Check JavaScript syntax
        run: node --check src/main.js
      - name: Check JavaScript as ES module
        run: node --input-type=module --check < src/main.js
      - name: Diagnostic around Rolldown parse offset
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/main.js').read_text(encoding='utf-8')
          pos = 28023
          line = text.count('\n', 0, pos) + 1
          col = pos - text.rfind('\n', 0, pos)
          print(f'offset={pos} line={line} col={col}')
          for idx, value in enumerate(text.splitlines(), 1):
              if 475 <= idx <= 505:
                  print(f'{idx:4}: {value}')
          print('context=', repr(text[max(0,pos-500):pos+500]))
          PY
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Verify production build
        run: npm run build
      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/style.css index.html package.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No tracked application changes"
            exit 0
          fi
          git commit -m "Fix Vessel authenticated runtime foundation"
          git push
